<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Painel de Compras — Moutinho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --red:#E31E24; --red-dark:#B8171C;
  --black:#0A0A0A;
  --gray-bg:#F7F7F8; --gray-bg2:#F0F0F2; --gray-border:#E7E7EA;
  --gray-txt:#8A8A8E; --gray-txt2:#ABABB2;
  --white:#FFFFFF;
  --green:#1FAA59; --green-bg:#E9F8EF;
  --blue:#2E7DD1; --blue-bg:#EAF3FC;
  --amber:#C9911A; --amber-bg:#FDF3DD;
  --orange:#D9711F; --orange-bg:#FCEBDD;
  --crit:#D93A3A; --crit-bg:#FCE8E8;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(10,10,10,.04), 0 6px 20px rgba(10,10,10,.05);
  --shadow-sm:0 1px 2px rgba(10,10,10,.05);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{overflow-x:hidden;}
body{max-width:100%; overflow-x:hidden; min-height:100vh;}
body{
  font-family:'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background:var(--gray-bg); color:var(--black);
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{height:6px; width:6px;}
::-webkit-scrollbar-thumb{background:var(--gray-border); border-radius:10px;}

/* ---------- App shell (sidebar layout) ---------- */
.app-shell{display:flex; min-height:100vh;}
.sidebar{
  width:236px; flex:0 0 236px; min-height:100vh; position:sticky; top:0; align-self:flex-start;
  background:linear-gradient(165deg, #150505 0%, #0A0A0A 55%, #1a0808 100%);
  display:flex; flex-direction:column; padding:22px 16px; gap:28px;
  box-shadow:2px 0 24px rgba(0,0,0,.12);
}
.sidebar-logo{display:flex; align-items:center; gap:11px; padding:6px 6px 14px; border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-logo img{height:44px; border-radius:8px; display:block;}
.sidebar-logo-text b{
  display:block; color:var(--white); font-size:16px; font-weight:800; letter-spacing:-.01em; line-height:1.2;
  background:linear-gradient(90deg, #fff 0%, #ffb3b3 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
}
.sidebar-logo-text span{display:block; color:rgba(255,255,255,.45); font-size:10.5px; font-weight:600; margin-top:2px;}
.sidebar-nav{display:flex; flex-direction:column; gap:4px;}
.sidebar-nav button{
  display:flex; align-items:center; gap:12px; text-align:left;
  border:none; background:transparent; color:rgba(255,255,255,.62);
  padding:12px 14px; border-radius:11px; font-family:inherit; font-size:13.5px; font-weight:700;
  cursor:pointer; transition:all .15s ease; position:relative;
}
.sidebar-nav button svg{width:19px; height:19px; flex:0 0 19px; opacity:.85;}
.sidebar-nav button:hover{background:rgba(255,255,255,.06); color:var(--white);}
.sidebar-nav button.active{
  background:linear-gradient(90deg, rgba(227,30,36,.22) 0%, rgba(227,30,36,.06) 100%);
  color:var(--white);
}
.sidebar-nav button.active svg{opacity:1; color:#ff5257;}
.sidebar-nav button.active::before{
  content:''; position:absolute; left:-16px; top:8px; bottom:8px; width:4px; border-radius:0 4px 4px 0;
  background:linear-gradient(180deg, var(--red), #ff5257);
}
.sidebar-foot{margin-top:auto; padding-top:14px; border-top:1px solid rgba(255,255,255,.08);}
.sidebar-foot .badge-live{
  display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700;
  color:#7CF0A8; background:rgba(31,170,89,.15); padding:5px 10px; border-radius:100px;
}
.sidebar-foot .badge-live .dot{width:6px; height:6px; border-radius:50%; background:#7CF0A8; animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.35;}}

.main-area{flex:1 1 auto; min-width:0; display:flex; flex-direction:column;}

/* ---------- Month subnav (com setas) ---------- */
.monthnav-wrap{background:var(--white); border-bottom:1px solid var(--gray-border); position:sticky; top:0; z-index:40;}
.monthnav-row{max-width:1240px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; gap:8px;}
.month-arrow{
  flex:0 0 auto; width:30px; height:30px; border-radius:50%; border:1px solid var(--gray-border);
  background:var(--white); color:var(--gray-txt); font-size:15px; font-weight:800; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:all .15s ease;
}
.month-arrow:hover{background:var(--black); border-color:var(--black); color:var(--white);}
.month-arrow:disabled{opacity:.3; cursor:default; pointer-events:none;}
.monthnav{
  display:flex; gap:8px; overflow-x:auto; scroll-behavior:smooth;
  -ms-overflow-style:none; scrollbar-width:none; flex:1 1 auto; min-width:0;
}
.monthnav::-webkit-scrollbar{display:none;}
.monthnav button{
  border:1px solid var(--gray-border); background:var(--white); border-radius:100px;
  padding:7px 14px; font-family:inherit; font-size:12.5px; font-weight:700;
  color:var(--gray-txt); cursor:pointer; white-space:nowrap; transition:all .15s ease; flex:0 0 auto;
}
.monthnav button:hover{border-color:var(--black); color:var(--black);}
.monthnav button.active{background:linear-gradient(135deg, var(--black), #2a1010); border-color:var(--black); color:var(--white);}
.monthnav button.has-data::after{content:'●'; color:var(--green); font-size:7px; margin-left:5px; vertical-align:middle;}

@media (max-width:860px){
  .app-shell{flex-direction:column;}
  .sidebar{
    width:100%; flex:0 0 auto; min-height:0; position:sticky; top:0; z-index:50;
    flex-direction:row; align-items:center; padding:12px 14px; gap:14px;
  }
  .sidebar-logo{border-bottom:none; padding:0; flex:0 0 auto;}
  .sidebar-logo-text span{display:none;}
  .sidebar-nav{flex-direction:row; overflow-x:auto; flex:1 1 auto; gap:4px;}
  .sidebar-nav button{padding:9px 12px; white-space:nowrap;}
  .sidebar-nav button.active::before{display:none;}
  .sidebar-foot{display:none;}
  .monthnav-wrap{top:0;}
}

/* ---------- Layout ---------- */
.page{max-width:1240px; margin:0 auto; padding:26px 24px 60px;}
.page{display:none;}
.page.active{display:block; animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

.section-title{
  font-size:12px; font-weight:800; letter-spacing:.04em; text-transform:uppercase;
  color:var(--red); margin:34px 0 12px;
  display:flex; align-items:center; gap:7px;
}
.section-title::before{content:''; width:7px; height:7px; border-radius:2px; background:var(--red); display:inline-block;}
.section-title:first-child{margin-top:0;}

/* ---------- Cards / grids ---------- */
.grid{display:grid; gap:14px;}
.grid-4{grid-template-columns:repeat(4, 1fr);}
.grid-2{grid-template-columns:repeat(2, 1fr);}
.grid-3{grid-template-columns:repeat(3, 1fr);}
@media (max-width:900px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(1,1fr);} }
@media (max-width:600px){ .grid-4{grid-template-columns:1fr;} .grid-2{grid-template-columns:1fr;} }

.card{
  background:var(--white); border:1px solid var(--gray-border); border-radius:var(--radius);
  padding:18px 20px; box-shadow:var(--shadow-sm);
  transition:box-shadow .18s ease, transform .18s ease;
}
.card:hover{box-shadow:var(--shadow); transform:translateY(-1px);}
.icon-badge{
  display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px;
  border-radius:10px; margin-bottom:10px;
}
.icon-badge svg{width:18px; height:18px;}
.stat-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--gray-txt); margin-bottom:8px;}
.stat-value{font-size:26px; font-weight:800; letter-spacing:-.02em;}
.stat-sub{font-size:12px; color:var(--gray-txt); margin-top:6px; font-weight:600;}
.delta{display:inline-flex; align-items:center; gap:3px; font-size:12px; font-weight:800; padding:2px 7px; border-radius:100px;}
.delta.up{color:var(--green); background:var(--green-bg);}
.delta.down{color:var(--crit); background:var(--crit-bg);}
.delta.flat{color:var(--gray-txt); background:var(--gray-bg2);}

/* ---------- Hero (Home) ---------- */
.hero{
  position:relative; overflow:hidden;
  display:grid; grid-template-columns:290px 1fr; gap:22px;
  background:var(--white); border:1px solid var(--gray-border); border-radius:22px;
  padding:28px; box-shadow:var(--shadow);
}
.hero::before{
  content:''; position:absolute; top:-60%; right:-15%; width:520px; height:520px;
  background:radial-gradient(circle, rgba(227,30,36,0.06) 0%, rgba(227,30,36,0) 70%);
  pointer-events:none;
}
@media (max-width:800px){ .hero{grid-template-columns:1fr;} }
.gauge-wrap{display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative;}
.gauge-canvas-wrap{position:relative; width:270px; height:156px;}
.gauge-center{
  position:absolute; left:0; right:0; bottom:6px; text-align:center;
}
.gauge-center .pct{font-size:38px; font-weight:800; letter-spacing:-.02em;}
.gauge-center .lbl{font-size:11px; font-weight:700; color:var(--gray-txt); text-transform:uppercase; letter-spacing:.04em; margin-top:2px;}
.gauge-status{
  margin-top:12px; font-size:12.5px; font-weight:800; padding:6px 14px; border-radius:100px;
  letter-spacing:.01em;
}
.hero-right{display:flex; flex-direction:column; gap:16px; justify-content:center; position:relative;}
.hero-alert{
  border-radius:var(--radius-sm); padding:13px 16px; font-weight:700; font-size:13.5px;
  display:flex; align-items:center; gap:10px;
}
.hero-mini-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
@media (max-width:520px){ .hero-mini-grid{grid-template-columns:1fr;} }
.hero-mini{border:1px solid var(--gray-border); border-radius:var(--radius-sm); padding:12px 14px; background:var(--gray-bg);}
.hero-mini .stat-label{margin-bottom:4px; font-size:10.5px;}
.hero-mini .stat-value{font-size:19px;}

/* ---------- Chart card ---------- */
.chart-card{background:var(--white); border:1px solid var(--gray-border); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow-sm);}
.chart-card h3{font-size:14px; font-weight:800; margin-bottom:2px;}
.chart-card .chart-sub{font-size:12px; color:var(--gray-txt); font-weight:600; margin-bottom:14px;}
.chart-holder{position:relative; height:280px; min-width:0;}
.chart-holder.tall{height:340px;}
.chart-holder canvas{max-width:100%;}
.grid > *{min-width:0;}

/* ---------- Tables ---------- */
.table-card{background:var(--white); border:1px solid var(--gray-border); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow-sm);}
table{width:100%; border-collapse:collapse; font-size:13px;}
thead th{
  background:var(--black); color:var(--white); text-align:center; font-weight:700; font-size:11.5px;
  text-transform:uppercase; letter-spacing:.02em; padding:11px 10px; position:sticky; top:0;
}
thead th.left{text-align:left;}
tbody td{padding:9px 10px; text-align:center; border-bottom:1px solid var(--gray-border); font-weight:600;}
tbody td.left{text-align:left; color:var(--gray-txt); font-weight:700;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:var(--gray-bg);}
tbody tr.total td{background:var(--gray-bg2); font-weight:800;}
.table-scroll{overflow-x:auto;}
.pill{display:inline-block; padding:2px 9px; border-radius:100px; font-size:11.5px; font-weight:800;}
.bar-cell{position:relative;}
.bar-track{position:relative; height:7px; border-radius:10px; background:var(--gray-bg2); overflow:hidden; margin-top:4px;}
.bar-fill{position:absolute; left:0; top:0; bottom:0; border-radius:10px;}

/* ---------- Legend / footnote ---------- */
.legend{display:flex; flex-wrap:wrap; gap:14px; font-size:12px; color:var(--gray-txt); font-weight:600; padding:14px 4px 4px;}
.legend span{display:inline-flex; align-items:center; gap:5px;}
.legend .dot{width:8px; height:8px; border-radius:50%; display:inline-block;}
.footnote{font-size:11.5px; color:var(--gray-txt2); text-align:center; margin-top:26px; font-weight:600;}

/* ---------- Empty / loading ---------- */
.loading-wrap{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 20px; color:var(--gray-txt);}
.spinner{width:34px; height:34px; border-radius:50%; border:3px solid var(--gray-border); border-top-color:var(--red); animation:spin .8s linear infinite; margin-bottom:14px;}
@keyframes spin{to{transform:rotate(360deg);}}
.error-box{
  background:var(--crit-bg); color:var(--crit); border-radius:var(--radius-sm); padding:16px 18px;
  font-weight:700; font-size:13.5px; margin-bottom:18px;
}

/* Focus visibility */
button:focus-visible{outline:2px solid var(--red); outline-offset:2px;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}
</style>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img id="logoImg" alt="Moutinho">
      <div class="sidebar-logo-text">
        <b>Painel de Compras</b>
        <span>Moutinho Materiais</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <button data-page="home" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l2-2 7-7 7 7 2 2"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
        Visão do Mês
      </button>
      <button data-page="historico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M7 16v-4M12 16V8M17 16v-7"/></svg>
        Histórico
      </button>
      <button data-page="detalhe">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>
        Detalhe Diário
      </button>
    </nav>
  </aside>

  <div class="main-area">
    <div class="monthnav-wrap" id="monthNavWrap">
      <div class="monthnav-row">
        <button class="month-arrow" id="monthPrev" aria-label="Mês anterior">‹</button>
        <div class="monthnav" id="monthNav"></div>
        <button class="month-arrow" id="monthNext" aria-label="Próximo mês">›</button>
      </div>
    </div>

    <!-- ================= HOME ================= -->
    <div class="page active" id="page-home">
      <div id="home-content"></div>
    </div>

    <!-- ================= HISTORICO ================= -->
    <div class="page" id="page-historico">
      <div id="historico-content"></div>
    </div>

    <!-- ================= DETALHE ================= -->
    <div class="page" id="page-detalhe">
      <div id="detalhe-content"></div>
    </div>
  </div>

// ---- Utilitários de formatação --------------------------------------------
function brNumber(str){
  if (str === null || str === undefined) return 0;
  let s = String(str).trim();
  if (s === "") return 0;
  s = s.replace(/R\$/g,"").replace(/%/g,"").trim();
  // remove thousand separators (.) then swap decimal comma for dot
  s = s.replace(/\./g,"").replace(/,/g,".");
  const v = parseFloat(s);
  return isNaN(v) ? 0 : v;
}
function fmtBRL(v){
  return (v||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL', minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtBRLcents(v){
  return (v||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}
function fmtPct(v, digits=1){
  return (v*100).toLocaleString('pt-BR', {minimumFractionDigits:digits, maximumFractionDigits:digits}) + '%';
}
function fmtNum(v, digits=0){
  return (v||0).toLocaleString('pt-BR', {minimumFractionDigits:digits, maximumFractionDigits:digits});
}

// ---- Tiers semânticos (mesmos 5 níveis da planilha) ------------------------
function tierFor(pct){
  if (pct >= 1)    return {name:"critico", color:COLORS.crit,   bg:COLORS.critBg,   label:"Ultrapassado"};
  if (pct >= 0.9)  return {name:"laranja", color:COLORS.orange, bg:COLORS.orangeBg, label:"Quase no limite"};
  if (pct >= 0.8)  return {name:"amber",   color:COLORS.amber,  bg:COLORS.amberBg,  label:"Atenção"};
  if (pct >= 0.6)  return {name:"azul",    color:COLORS.blue,   bg:COLORS.blueBg,   label:"Controlado"};
  return               {name:"verde",   color:COLORS.green,  bg:COLORS.greenBg,  label:"Tranquilo"};
}

// ---- Fetch com fallback de CORS em 3 camadas -------------------------------
async function fetchWithFallback(url){
  const attempts = [
    {name:'direto', u: url},
    {name:'corsproxy.io', u: 'https://corsproxy.io/?url=' + encodeURIComponent(url)},
    {name:'codetabs', u: 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url)},
    {name:'allorigins', u: 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url)},
  ];
  let lastErr = null;
  for (const attempt of attempts){
    try{
      const res = await fetch(attempt.u, {cache:"no-store"});
      if (!res.ok) { lastErr = new Error(attempt.name+': HTTP '+res.status); continue; }
      const text = await res.text();
      if (text && text.length > 20 && !text.trim().startsWith('<')) return text;
      lastErr = new Error(attempt.name+': resposta vazia ou inválida');
    }catch(e){
      lastErr = new Error(attempt.name+': '+(e && e.message ? e.message : e));
    }
  }
  throw lastErr || new Error('Falha ao buscar '+url);
}

// ---- Parser de uma aba mensal (layout fixo, ver planilha mestra) ----------
function parseMonthCSV(text){
  const parsed = Papa.parse(text, {skipEmptyLines:false}).data;
  const row = (i) => parsed[i] || [];

  const cota      = brNumber(row(5)[0]);
  const comprado  = brNumber(row(5)[2]);
  const disponivel= brNumber(row(5)[4]);
  const utilizado = brNumber(row(5)[6]) / 100;
  const alerta    = (row(7)[0] || "").trim();

  const pedidos     = brNumber(row(10)[0]);
  const mediaDiaria = brNumber(row(10)[2]);
  const maiorVolume = brNumber(row(10)[4]);
  const diasUteis   = brNumber(row(10)[6]);

  const dias = [];
  let i = 14;
  while (parsed[i] && !String(parsed[i][0]||"").toUpperCase().startsWith("TOTAL")){
    const r = parsed[i];
    if ((r[0]||"").toString().trim() !== ""){
      dias.push({
        data: (r[0]||"").trim(),
        valorComprado: brNumber(r[1]),
        temValor: (r[1]||"").toString().trim() !== "",
        acumulado: brNumber(r[2]),
        pctCota: brNumber(r[3])/100,
        nPedidos: brNumber(r[6]),
        temPedido: (r[6]||"").toString().trim() !== "",
        pedidosAcumulado: brNumber(r[7]),
      });
    }
    i++;
  }

  return {cota, comprado, disponivel, utilizado, alerta, pedidos, mediaDiaria, maiorVolume, diasUteis, dias};
}

const STATE = {
  data: {},        // key -> parsed object | null (erro) | undefined (não carregado)
  loaded: false,
  currentPage: 'home',
  currentMonthKey: null,
};

function monthHasData(d){
  return !!d && (d.comprado > 0 || d.pedidos > 0 || d.cota > 0);
}

function currentRealMonthKey(){
  // tenta achar o mês "atual" com base na data real do navegador; senão cai no último mês com dado; senão o primeiro
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth()+1;
  const exact = MONTHS.find(mm => mm.year===y && mm.month===m);
  if (exact && monthHasData(STATE.data[exact.key])) return exact.key;
  for (let i = MONTHS.length-1; i>=0; i--){
    if (monthHasData(STATE.data[MONTHS[i].key])) return MONTHS[i].key;
  }
  return MONTHS[0].key;
}

/* =========================================================================
   CARREGAMENTO
   ========================================================================= */
async function loadAllMonths(){
  const results = await Promise.all(MONTHS.map(async (m) => {
    try{
      const text = await fetchWithFallback(m.url);
      return {key:m.key, data: parseMonthCSV(text), error:null};
    }catch(e){
      return {key:m.key, data:null, error: (e && e.message) || 'Erro desconhecido'};
    }
  }));
  results.forEach(r => { STATE.data[r.key] = r.data; });
  STATE.errors = results.filter(r => r.error).map(r => r.key);
  STATE.loaded = true;
}

function buildMonthNav(){
  const nav = document.getElementById('monthNav');
  nav.innerHTML = '';
  MONTHS.forEach(m => {
    const btn = document.createElement('button');
    btn.textContent = m.label;
    btn.dataset.key = m.key;
    if (monthHasData(STATE.data[m.key])) btn.classList.add('has-data');
    if (m.key === STATE.currentMonthKey) btn.classList.add('active');
    btn.addEventListener('click', () => {
      STATE.currentMonthKey = m.key;
      renderCurrentPage();
      buildMonthNav();
    });
    nav.appendChild(btn);
  });
  // auto-scroll to active (calculado manualmente, restrito à própria nav — evita rolar a página inteira)
  const activeBtn = nav.querySelector('button.active');
  if (activeBtn){
    const target = activeBtn.offsetLeft - (nav.clientWidth/2) + (activeBtn.clientWidth/2);
    nav.scrollTo({left: Math.max(0,target), behavior:'smooth'});
  }
  updateMonthArrows();
}

function updateMonthArrows(){
  const nav = document.getElementById('monthNav');
  const prevBtn = document.getElementById('monthPrev');
  const nextBtn = document.getElementById('monthNext');
  if (!nav || !prevBtn || !nextBtn) return;
  const maxScroll = nav.scrollWidth - nav.clientWidth;
  prevBtn.disabled = nav.scrollLeft <= 4;
  nextBtn.disabled = nav.scrollLeft >= maxScroll - 4;
}

document.querySelectorAll('.sidebar-nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sidebar-nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const pageId = 'page-' + btn.dataset.page;
    document.getElementById(pageId).classList.add('active');
    STATE.currentPage = btn.dataset.page;
    const monthNavWrap = document.getElementById('monthNavWrap');
    monthNavWrap.style.display = (btn.dataset.page === 'historico') ? 'none' : '';
    renderCurrentPage();
  });
});

function deltaBadge(curr, prev){
  if (prev === null || prev === undefined || prev === 0){
    return `<span class="delta flat">— vs mês ant.</span>`;
  }
  const diff = ((curr - prev) / Math.abs(prev)) * 100;
  if (Math.abs(diff) < 0.5) return `<span class="delta flat">≈ estável vs mês ant.</span>`;
  const up = diff > 0;
  const arrow = up ? '▲' : '▼';
  return `<span class="delta ${up?'up':'down'}">${arrow} ${Math.abs(diff).toFixed(0)}% vs mês ant.</span>`;
}

}

   PÁGINA: DETALHE DIÁRIO
   ========================================================================= */
function renderDetalhe(){
  const host = document.getElementById('detalhe-content');
  const key = STATE.currentMonthKey;
  const meta = monthMeta(key);
  const d = STATE.data[key];

  if (!d){
    host.innerHTML = `<div class="error-box">Não foi possível carregar os dados de ${meta.label}.</div>`;
    return;
  }

  const maxValor = Math.max(1, ...d.dias.map(x=>x.valorComprado));
  const maxPedidos = Math.max(1, ...d.dias.map(x=>x.nPedidos));

  host.innerHTML = `
    <div class="section-title">Detalhe diário — ${MONTH_NAME_PT[meta.month]} de ${meta.year}</div>
    <div class="table-card">
      <div class="table-scroll">
        <table>
          <thead><tr>
            <th class="left">Data</th><th>Valor Comprado</th><th>Acumulado</th><th>% da Cota</th><th>Nº Pedidos</th><th>Acumulado Pedidos</th>
          </tr></thead>
          <tbody>
            ${d.dias.map(x => {
              const t = tierFor(x.pctCota);
              const showTier = d.cota > 0 && x.temValor;
              return `<tr>
                <td class="left">${x.data}</td>
                <td>
                  ${x.temValor ? fmtBRL(x.valorComprado) : '<span style="color:'+COLORS.grayTxt2+'">—</span>'}
                  ${x.temValor ? `<div class="bar-track"><div class="bar-fill" style="width:${(x.valorComprado/maxValor*100).toFixed(0)}%; background:${COLORS.red}"></div></div>` : ''}
                </td>
                <td>${fmtBRL(x.acumulado)}</td>
                <td><span class="pill" style="color:${showTier?t.color:COLORS.grayTxt}; background:${showTier?t.bg:COLORS.grayBg2}">${d.cota>0?fmtPct(x.pctCota):'—'}</span></td>
                <td>
                  ${x.temPedido ? fmtNum(x.nPedidos) : '<span style="color:'+COLORS.grayTxt2+'">—</span>'}
                  ${x.temPedido ? `<div class="bar-track"><div class="bar-fill" style="width:${(x.nPedidos/maxPedidos*100).toFixed(0)}%; background:${COLORS.blue}"></div></div>` : ''}
                </td>
                <td>${fmtNum(x.pedidosAcumulado)}</td>
              </tr>`;
            }).join('')}
            <tr class="total">
              <td class="left">TOTAL DO MÊS</td>
              <td>${fmtBRL(d.comprado)}</td>
              <td>${fmtBRL(d.comprado)}</td>
              <td>${d.cota>0?fmtPct(d.utilizado):'—'}</td>
              <td>${fmtNum(d.pedidos)}</td>
              <td>${fmtNum(d.pedidos)}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="legend">
      <span><span class="dot" style="background:${COLORS.green}"></span>&lt;60% Tranquilo</span>
      <span><span class="dot" style="background:${COLORS.blue}"></span>60-80% Controlado</span>
      <span><span class="dot" style="background:${COLORS.amber}"></span>80-90% Atenção</span>
      <span><span class="dot" style="background:${COLORS.orange}"></span>90-100% Quase no limite</span>
      <span><span class="dot" style="background:${COLORS.crit}"></span>≥100% Ultrapassado</span>
    </div>
  `;
}

/* =========================================================================
   INICIALIZAÇÃO
   ========================================================================= */
async function init(){
  const homeHost = document.getElementById('home-content');
  homeHost.innerHTML = `<div class="loading-wrap"><div class="spinner"></div>Carregando dados da planilha...</div>`;

  await loadAllMonths();

  STATE.currentMonthKey = currentRealMonthKey();
  buildMonthNav();

  const allFailed = STATE.errors && STATE.errors.length === MONTHS.length;
  if (allFailed){
    homeHost.innerHTML = `
      <div class="error-box">
        Não foi possível carregar nenhum mês da planilha agora. Isso costuma acontecer ao pré-visualizar o
        arquivo fora do navegador real (ex: dentro de um preview em sandbox) — nesses casos a conexão com o
        Google Sheets fica bloqueada. Abra o link publicado (GitHub Pages) em uma aba normal do navegador para testar de verdade.
        <div style="margin-top:10px;">
          <button onclick="location.reload()" style="background:${COLORS.crit}; color:#fff; border:none; padding:8px 16px; border-radius:8px; font-weight:700; font-family:inherit; cursor:pointer;">Tentar novamente</button>
        </div>
      </div>`;
    return;
  }

  if (STATE.errors && STATE.errors.length){
    console.warn(`Falha ao carregar ${STATE.errors.length} de ${MONTHS.length} mês(es):`, STATE.errors.join(', '));
  }

  renderCurrentPage();
}

init();

</script>
</body>
</html>
